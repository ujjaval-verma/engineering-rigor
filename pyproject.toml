[project]
name = "example_app"
version = "0.1.0"
description = "engineering-rigor template app"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.11", "pydantic-settings>=2.10"]

[dependency-groups]
dev = ["pytest>=8.4", "pytest-cov>=6.2", "pyright>=1.1.404", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_app"]

[tool.uv]
required-version = ">=0.8"
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/_generated/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "ANN", "T20", "FBT", "FIX", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "FBT"]  # test signatures are fixtures, not contracts
"harness/*.py" = ["T201"]  # CLI scripts report via print

[tool.pyright]
include = ["src", "tests", "harness"]
typeCheckingMode = "basic"
strict = ["src/example_app/core"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-q --strict-markers --import-mode=importlib -m 'not needs_llm and not needs_net'"
testpaths = ["tests"]
markers = [
  "needs_llm: requires an LLM API key; excluded by default",
  "needs_net: requires network; excluded by default",
  "slow: drives real git hooks in a scratch repo; excluded from `just check`",
]
